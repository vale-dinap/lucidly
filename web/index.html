<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lucidly</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script src="theme.js"></script>
  </head>
  <body>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Open sessions" hidden></nav>
    <header class="top">
      <div class="brand"><img src="favicon.svg" alt="" width="20" height="20" /><span>Lucidly</span></div>
      <button class="ibtn open-btn" id="sessionsBtn" title="Open session (O)" aria-label="Open session">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5V6a1.5 1.5 0 0 1 1.5-1.5h4l2 2h8A1.5 1.5 0 0 1 20.5 8v1.5" /><path d="M3.5 9.5h17l-1.6 8.2a1.5 1.5 0 0 1-1.5 1.3H6.6a1.5 1.5 0 0 1-1.5-1.3z" /></svg>
      </button>
      <a class="ibtn save-btn" id="saveBtn" title="Save a snapshot of this run to a file, to keep or share it" aria-label="Save snapshot">
        <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14" /></svg>
      </a>
      <div class="run" id="runBox" title="Open another session (O)">
        <div class="run-title" id="runTitle">No run open</div>
        <div class="run-sub" id="runSub"></div>
      </div>
      <span class="pill" id="status" data-status="idle"><i></i><span id="statusText">Idle</span></span>
      <div class="wake-wrap">
        <button class="ibtn wake" id="wakeBtn" aria-haspopup="dialog" aria-label="Keep this device awake" title="Keep this device awake">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path class="steam" d="M9 3.5c-.8.9.8 1.6 0 2.5 M12.5 3.5c-.8.9.8 1.6 0 2.5" /><path d="M5 9h11v4.5A5.5 5.5 0 0 1 10.5 19h0A5.5 5.5 0 0 1 5 13.5z M16 10.5h1.2a2.5 2.5 0 0 1 0 5H15.6 M4 21h13" /></svg>
        </button>
        <div class="pop wake-pop" id="wakePop" hidden></div>
      </div>
      <div class="wake-wrap">
        <button class="ibtn snd" id="soundBtn" aria-haspopup="dialog" aria-label="Sound alerts" title="Sound alerts">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 2h-14z M10 20.5a2.1 2.1 0 0 0 4 0" /><path class="waves" d="M20 7.5a6 6 0 0 1 1 3.5 M4 7.5a6 6 0 0 0-1 3.5" /><path class="mute" d="M4 4l16 16" /></svg>
        </button>
        <div class="pop wake-pop" id="soundPop" hidden></div>
      </div>
      <div class="grow"></div>
      <div class="meter-wrap">
        <span class="pill warn" id="outdated" hidden title="Lucidly's engine was updated after this server started. Stop it and run lucidly again to apply the update: some data (such as token counts) may be missing until then.">Restart Lucidly to update</span>
        <button class="meter" id="tokens" hidden title="Token usage (T)" aria-haspopup="dialog"></button>
        <div class="pop" id="tokensPop" hidden></div>
      </div>
      <button class="ibtn theme-btn" id="themeBtn" type="button"></button>
    </header>
    <div class="down-bar" id="downBar" role="alert" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7V3m6 4V3M7 7h10v4a5 5 0 0 1-10 0zM12 16v5" /><path d="M4 4l16 16" /></svg>
      <span><b>The Lucidly server has stopped.</b> This page no longer updates: it shows the session as of <span id="downAt"></span>. Run <code>lucidly</code> again and it reconnects by itself.</span>
    </div>

    <main class="main">
      <section class="pane" id="pane">
        <div id="overview"></div>

        <div class="toolbar" id="tbPath">
          <nav class="seg vseg" aria-label="View">
            <button type="button" data-view="glance" title="The run at a glance: is it going fine, does it need you? (V)">Glance</button>
            <button type="button" data-view="simple" class="on" title="Tasks and their steps as nodes: the essentials (V)">Simple</button>
            <button type="button" data-view="detailed" title="Every step, with its details (V)">Detailed</button>
            <button type="button" data-view="files" title="Every file the agent changed, with its edits (V)">Files</button>
            <button type="button" data-view="actions" title="Every action in order, for debugging (V)">Actions</button>
          </nav>
          <div class="chips" id="pathModes"></div>
          <label class="switch"><input type="checkbox" id="hideChat" /><span></span>Hide Q&amp;A</label>
          <div class="grow"></div>
          <div class="search">
            <svg viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM20 20l-4-4" /></svg>
            <input type="search" id="pathSearch" placeholder="Search steps, files, commands" autocomplete="off" />
          </div>
          <div class="zoomer" id="flowZoom" role="group" aria-label="Zoom" hidden><input type="range" id="flowZoomRange" min="0" max="6" step="1" value="3" aria-label="Zoom" title="Zoom: 50% to 200% (Ctrl+scroll, - and =)" /><button type="button" data-fz="0" class="zv">100%</button></div>
          <button class="ibtn heat-btn" id="heatBtn" aria-pressed="false" aria-label="Token heat" title="Token heat (H)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c.5 3.2 4.5 5.2 4.5 10a4.5 4.5 0 0 1-9 0c0-2 .9-3.4 2-4.5.2 1.6 1 2.6 2 3 .3-3.3-.8-5.8.5-8.5z" /></svg></button>
          <button class="tbtn" id="expandAll" title="Expand all (E)">Expand all</button>
        </div>

        <div class="toolbar" id="tbActions" hidden>
          <nav class="seg vseg" aria-label="View">
            <button type="button" data-view="glance" title="The run at a glance: is it going fine, does it need you? (V)">Glance</button>
            <button type="button" data-view="simple" title="Tasks and their steps as nodes: the essentials (V)">Simple</button>
            <button type="button" data-view="detailed" title="Every step, with its details (V)">Detailed</button>
            <button type="button" data-view="files" title="Every file the agent changed, with its edits (V)">Files</button>
            <button type="button" data-view="actions" class="on" title="Every action in order, for debugging (V)">Actions</button>
          </nav>
          <div class="chips" id="kindFilters"></div>
          <div class="grow"></div>
          <nav class="seg err-seg" id="errFilter" aria-label="Failures"></nav>
          <select id="actionsGoal" aria-label="Task"></select>
          <div class="search">
            <svg viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM20 20l-4-4" /></svg>
            <input type="search" id="actionsSearch" placeholder="Filter  ( / )" autocomplete="off" />
          </div>
          <button class="tbtn" id="copyCommands" title="Copy the listed shell commands">Copy commands</button>
        </div>

        <div id="pathView"></div>
        <div id="actionsView" hidden></div>

        <div class="empty" id="empty">
          <img src="favicon.svg" alt="" width="44" height="44" />
          <h2>Nothing to show yet</h2>
          <p>Open a Claude Code session, or pipe an agent's output into <code>lucidly</code>.</p>
          <button class="btn primary" id="emptyOpen">Choose a session</button>
        </div>
        <div class="fab-wrap"><button type="button" class="fab" id="toEnd" hidden title="Jump to the end and follow the agent (F)" aria-label="Jump to the end">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v13m0 0l-5.5-5.5M12 18l5.5-5.5" /></svg><span class="fab-n" id="toEndN" hidden></span>
        </button></div>
      </section>
      <aside class="detail" id="detail" hidden></aside>
    </main>

    <dialog id="picker" class="picker">
      <form method="dialog" class="picker-h">
        <h3 id="pickerTitle">Open session</h3>
        <nav class="seg">
          <button type="button" data-scope="project" class="on">This project</button>
          <button type="button" data-scope="all">All projects</button>
        </nav>
        <button class="ibtn" value="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
      </form>
      <div id="pickerOpen"></div>
      <ul id="pickerList" class="plist"></ul>
      <div class="picker-hint" id="pickerHint"></div>
      <label class="picker-f" title="A file saved with the download button: keeps a run after its transcript is gone, or lets someone else open it">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V9m0 0l-4 4m4-4l4 4M5 4h14" /></svg>
        Open a saved snapshot…
        <input type="file" id="loadInput" accept=".json,application/json" hidden />
      </label>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
