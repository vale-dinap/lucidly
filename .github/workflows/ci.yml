name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The oldest Node Lucidly supports (package.json "engines") and the current LTS.
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Installed from npm, Lucidly runs the compiled dist/, not the TypeScript sources: pack it,
      # install the tarball in an empty project and start the command, the way a user would.
      - name: Package smoke test
        shell: bash
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/*.tgz
          npx lucidly --help
